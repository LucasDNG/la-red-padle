# Evolution API v2 local, separado de la base de la liga.
# La clave y la contraseña de abajo son sólo para esta máquina.
# EVOLUTION_API_KEY del proyecto tiene que ser igual a AUTHENTICATION_API_KEY.
#
#   docker compose -f docker-compose.evolution.yml up -d
#   panel: http://localhost:8081
#   API:   http://localhost:8080
#
# En el panel creá la instancia "laredpadel" y escaneá el QR con el WhatsApp de la liga.

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: change-me-local-only
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: laredpadel
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
    volumes:
      - evolution_instances:/evolution/instances

  evolution-manager:
    image: evoapicloud/evolution-manager:v2.3.5
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      - "127.0.0.1:8081:80"

  evolution-redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

  evolution-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

volumes:
  evolution_instances:
  evolution_redis:
  evolution_postgres:
